name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # STEP 1: Set up Java 17 (Required to run the modern sdkmanager)
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # STEP 2: Download the missing Android 28 files using Java 17
    - name: Install Android SDK 28
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"

    # STEP 3: Switch back to Java 8 (Required to run ancient Gradle 2.2.1)
    - name: set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # STEP 4: Build the App
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '2.2.1'
      
    - name: Build Debug APK
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Next-IDE-APK
        path: app/build/outputs/apk/**/*.apk
